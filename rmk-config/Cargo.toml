[package]
name = "rmk-config"
version = "0.8.0"
edition = "2024"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Config crate of RMK"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
license = "MIT OR Apache-2.0"
resolver = "2"

[features]
# Derive tsify TS types on the layout structs; turned on by the rynk wasm build.
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
config = "0.15"
miniz_oxide = "0.9"
once_cell = "1.19"
paste = "1.0.15"
pest = "2.8"
pest_derive = "2.8"
# Build-time only (rmk-config never ships in the firmware binary): serialize +
# compress the layout blob. The host inflates with the same codec.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-inline-default = "1"
toml = "1"
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
