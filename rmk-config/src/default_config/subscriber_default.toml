# Feature-based event subscriber declarations.
#
# When all `features` listed in an entry are enabled (checked via
# CARGO_FEATURE_* env vars at build time), each event's `subs` is
# bumped by the specified amount.
#
# This keeps event_default.toml at base counts and avoids wasting
# static memory when a feature is disabled.
#
# Format per event: { name = "event_name", count = N }
# `count` defaults to 1 if omitted.

# --- Display-gated internal subscribers ---

[[subscriber]]
features = ["display"]
events = [
    # display/mod.rs: DisplayProcessor subscribes to these events
    { name = "keyboard" },
    { name = "wpm_update" },
    { name = "modifier" },
    { name = "sleep_state" },
    { name = "layer_change" },
    { name = "battery_status" },
    { name = "led_indicator" },
]

[[subscriber]]
features = ["display", "_ble"]
events = [
    # display/mod.rs: DisplayProcessor subscribes when _ble is enabled
    { name = "connection_status_change" },
]

[[subscriber]]
features = ["display", "split"]
events = [
    # split/driver.rs: each PeripheralManager subscribes when display is enabled
    # (gated on #[cfg(feature = "display")] in driver.rs)
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "wpm_update", count = 2 },
]

# BatteryLedProcessor can run on USB-only boards too.
[[subscriber]]
features = []
events = [{ name = "battery_status" }]

# --- BLE-gated internal subscribers ---

[[subscriber]]
features = ["_ble"]
events = [
    # ble/battery_service.rs: BatteryStatusEvent::subscriber()
    { name = "battery_status" },
    # ble/mod.rs: KeyboardEvent/PointingEvent wake subscribers, created when
    # advertising times out. Without a reserved slot they panic on boards whose
    # permanent subscribers already fill the base count.
    { name = "keyboard" },
    { name = "pointing" },
]

# The USB Rynk connection subscribes to these topics. BLE counts are sized
# from the configured host-link capacity in build_constants.

[[subscriber]]
features = ["rynk"]
events = [
    { name = "battery_status" },
    { name = "layer_change" },
    { name = "wpm_update" },
    { name = "connection_status_change" },
    { name = "sleep_state" },
    { name = "led_indicator" },
]

# --- Dongle-gated internal subscribers (both binaries enable `dongle`) ---

[[subscriber]]
features = ["dongle"]
events = [
    # dongle/mod.rs: LedIndicatorEvent::subscriber() on the one keyboard link.
    { name = "led_indicator" },
    # dongle/event.rs: keyboard side, one subscriber per row of DongleEvent.
    { name = "action" },
    { name = "modifier" },
    { name = "layer_change" },
    { name = "wpm_update" },
    { name = "sleep_state" },
    { name = "battery_status" },
]

[[subscriber]]
features = ["dongle", "display"]
events = [
    # display/mod.rs: DisplayProcessor subscribes on a dongle with a screen.
    { name = "dongle_state" },
]

# --- Split-gated internal subscribers ---

[[subscriber]]
features = ["split"]
events = [
    # split/peripheral.rs: BatteryStatusEvent::subscriber(), on every transport.
    { name = "battery_status" },
    # split/peripheral.rs: KeyboardEvent::subscriber()
    { name = "keyboard" },
    # split/peripheral.rs: PointingEvent::subscriber()
    { name = "pointing" },
    # split/driver.rs: LedIndicatorEvent::subscriber()
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "led_indicator", count = 2 },
    # split/driver.rs: LayerChangeEvent::subscriber()
    { name = "layer_change" },
    # split/driver.rs: ConnectionStatusChangeEvent::subscriber()
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "connection_status_change", count = 2 },
    # split/driver.rs: SleepStateEvent::subscriber()
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "sleep_state", count = 2 },
]

# --- Split + BLE-gated internal subscribers ---

[[subscriber]]
features = ["split", "_ble"]
events = [
    # split/ble/peripheral.rs: KeyboardEvent::subscriber() (temporary, on timeout)
    { name = "keyboard" },
    # split/driver.rs: ClearPeerEvent::subscriber() (cfg _ble)
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "clear_peer", count = 2 },
    # split/ble/central.rs: SleepStateEvent::subscriber() per connected link
    # Covers up to 2 peripherals; for 3+ peripherals override subs in keyboard.toml
    { name = "sleep_state", count = 2 },
]

# --- DFU Lock-gated internal subscribers ---

[[subscriber]]
features = ["dfu_lock"]
events = [
    # dfu/mod.rs: DfuLock subscribes to DfuCmdEvent for UnlockRequest
    { name = "dfu_cmd" },
]
