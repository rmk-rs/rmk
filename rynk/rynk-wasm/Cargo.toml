[package]
name = "rynk-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "Rynk host support compiled to a wasm package: typed `rynk` Client plus JS byte-link transport, built with wasm-pack"
license = "MIT OR Apache-2.0"
repository.workspace = true

# Built by `wasm-pack build --target web`; unit tests run with `wasm-pack test --node`.
# Native checks compile an empty crate because `src/lib.rs` is wasm32-gated.
[lib]
crate-type = ["cdylib"]

[dependencies]
rynk = { path = "..", features = ["wasm"] }
embassy-futures = "0.1"
embassy-sync.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
# Vial host client: `vial.json` decoding (xz/lzma + JSON) and KLE → LayoutInfo.
rynk-kle = { path = "../rynk-kle", optional = true }
lzma-rs = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
heapless = { version = "0.9", optional = true }

[features]
# Vial host client (`connect_vial` + `VialClient`), for keyboards on the
# legacy protocol. Off by default; the GUI's wasm build turns it on.
vial = ["rynk/vial", "dep:rynk-kle", "dep:lzma-rs", "dep:serde_json", "dep:heapless"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
