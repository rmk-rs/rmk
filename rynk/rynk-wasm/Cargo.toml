[package]
name = "rynk-wasm"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rynk host support compiled to a wasm package: typed `rynk` Client plus JS byte-link transport, built with wasm-pack"
license.workspace = true
repository.workspace = true
keywords = ["keyboard", "firmware", "rmk", "protocol", "wasm"]

# Built by `wasm-pack build --target web`; unit tests run with `wasm-pack test --node`.
# Native checks compile an empty crate because `src/lib.rs` is wasm32-gated.
[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
embassy-futures = "0.1"
embassy-sync.workspace = true
js-sys = "0.3"
log = "0.4"
rynk = { path = "..", version = "0.3", features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
