[package]
name = "rmk-nrf54lm20-dongle"
version = "0.1.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "RMK tri-mode dongle firmware for nRF54LM20A"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rmk-nrf54lm20-dongle"
test = false
bench = false

[dependencies]
rmk = { path = "../../../../rmk", default-features = false, features = [
    "dongle",
    "nrf54lm20_ble",
    "storage",
    "defmt",
] }

embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf54lm20-app-s",
    "time-driver-grtc",
    "gpiote",
    "unstable-pac",
    "time",
] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
    "defmt",
    "critical-section-impl",
    "nrf54lm20-app-s",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf54lm20-app-s",
] }

bt-hci = { version = "0.11", features = ["defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"

