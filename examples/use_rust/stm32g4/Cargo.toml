[package]
name = "rmk-stm32g4"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rmk-stm32g4"
test = false
bench = false

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = ["defmt"] }

embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-stm32 = { version = "0.6", features = [
    "stm32g431rb",
    "defmt",
    "memory-x",
    "time-driver-any",
] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }

cortex-m = { version = "0.7.7", features = ['critical-section-single-core'] }
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-halt = "1"

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = "s"
overflow-checks = true
lto = "fat"
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
