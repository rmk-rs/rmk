[package]
name = "rmk-esp32c3"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = [
    "esp32c3_ble",
    "log",
    "storage",
    "vial",
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.20", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32c3"] }
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
esp-alloc = { version = "0.11" }
esp-println = { version = "0.18", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32c3", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32c3", "esp-radio", "embassy"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3", "log-04"] }
bt-hci = { version = "0.10" }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
embuild = "0.33"
cc = "1.2.9"

[[bin]]
name = "rmk-esp32c3"
test = false
bench = false

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false

# Released esp-radio (1.0.0-beta.0) pins bt-hci 0.8, which predates the shared
# bt-hci-transport trait rmk/trouble-host need. Pin the whole esp graph to the esp-hal 1.2.0
# release commit (tag esp-hal-v1.2.0), whose esp-radio speaks bt-hci-transport.
[patch.crates-io]
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef" }
