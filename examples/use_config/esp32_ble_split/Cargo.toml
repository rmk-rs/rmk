[package]
name = "rmk-esp32c3"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
central = [
    "rmk/esp32c6_ble",
    "esp-backtrace/esp32c6",
    "esp-storage/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
peripheral = [
    "rmk/esp32c3_ble",
    "esp-backtrace/esp32c3",
    "esp-storage/esp32c3",
    "esp-hal/esp32c3",
    "esp-println/esp32c3",
    "esp-radio/esp32c3",
    "esp-rtos/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = [
    "log",
    "split",
    "storage",
    "vial",
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.19", features = [
    "panic-handler",
    "println",
] }
esp-storage = { version = "0.9", features = ["embedded-storage"] }
esp-hal = { version = "1.2.0-rc.0", features = ["unstable"] }
esp-alloc = { version = "0.10" }
esp-println = { version = "0.17", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["ble", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp-radio", "embassy"]}
esp-bootloader-esp-idf = { version = "0.5", features = ["log-04"] }
bt-hci = { version = "0.10" }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
embuild = "0.33"
cc = "1.2.9"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"
required-features = ["central"]

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
required-features = ["peripheral"]


[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false

# Released esp-radio (1.0.0-beta.0) pins bt-hci 0.8, which predates the shared
# bt-hci-transport trait rmk/trouble-host need. Pin the whole esp graph to esp-rs/esp-hal
# main, which pairs esp-hal 1.2.0-rc.0 with an esp-radio that speaks bt-hci-transport.
[patch.crates-io]
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7f5538294626536cfc9ec8b8a2b3adbc2685bbb2" }
