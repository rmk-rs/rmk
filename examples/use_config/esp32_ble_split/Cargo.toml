[package]
name = "rmk-esp32c3"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"
required-features = ["central"]

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
required-features = ["peripheral"]

[features]
default = []
central = [
    "rmk/esp32c6_ble",
    "esp-backtrace/esp32c6",
    "esp-storage/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
peripheral = [
    "rmk/esp32c3_ble",
    "esp-backtrace/esp32c3",
    "esp-storage/esp32c3",
    "esp-hal/esp32c3",
    "esp-println/esp32c3",
    "esp-radio/esp32c3",
    "esp-rtos/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = [
    "log",
    "split",
    "storage",
    "vial",
] }

bt-hci = { version = "0.11" }
embassy-executor = { version = "0.10" }
esp-alloc = { version = "0.11" }
esp-backtrace = { version = "0.20", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04"] }
esp-hal = { version = "1.2.2", features = ["unstable"] }
esp-println = { version = "0.18", features = ["log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["ble", "unstable"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "embassy"] }
esp-storage = { version = "0.10", features = ["embedded-storage"] }

[build-dependencies]
cc = "1.2.9"
const-gen = "1.6"
embuild = "0.33"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false
