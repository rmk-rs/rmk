[package]
name = "rmk-rp2040"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rmk-rp2040"
test = false
bench = false

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = ["defmt", "storage", "vial", "watchdog", "rp2040"] }

embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-time = { version = "0.5", features = ["defmt"] }

cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
portable-atomic = { version = "1", features = ["critical-section"] }

# [features]
# avoid having to use --allow-multiple-definition linker flag
# on macOS with Apple Silicon at least
# default = ["rp-pico/disable-intrinsics"]

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
