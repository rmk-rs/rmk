[keyboard]
# Replace with your keyboard identity.
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "haobo"
chip = "rp2040"

[host]
# Use Rynk instead of Vial; their rmk features conflict.
vial_enabled = false
rynk_enabled = true

[matrix]
# Matrix pins are required.
row_pins = ["PIN_6", "PIN_7", "PIN_8", "PIN_9"]
col_pins = ["PIN_19", "PIN_20", "PIN_21"]
# Default diode direction is col2row; set `row2col = true` if needed.
# row2col = true

[layout]
# The physical key layout.
rows = 4
cols = 3
map = """
(0,0)  (0,1)  (0,2)
(1,0)  (1,1)  (1,2)
(2,0)  (2,1)  (2,2)
(3,0)  (3,1)  (3,2)
"""

[keymap]
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
_  TT(1)  TG(2)
_  _      _
_  _      _
_  _      _
"""

[storage]
# Storage is enabled by default.
# enabled = false

[rmk]
max_morses = 8
max_patterns_per_key = 8
