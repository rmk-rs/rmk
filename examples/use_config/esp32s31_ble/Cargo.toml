[package]
name = "rmk-esp32s31"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rmk-esp32s31"
test = false
bench = false

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = [
    "esp32s31_ble",
    "log",
    "storage",
    "rynk",
    "dongle",
    "async_matrix",
] }
embassy-executor = "0.10"
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s31", "log-04"] }
esp-hal = { version = "=1.2.0", features = ["esp32s31", "unstable"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32s31", "log-04", "uart"] }
esp-radio = { version = "1.0.0-beta.2", features = ["esp32s31", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32s31", "esp-radio", "embassy"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s31"] }
bt-hci = "0.11"

[profile.dev]
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

# The esp-hal release still lacks the S31 USB HS RX FIFO sizing fix.
# Sync the Embassy entries with rmk/Cargo.toml.

[patch.crates-io]
# ESP HAL still uses embassy-usb-driver 0.2 for native USB.
# Embassy USB and the time driver must resolve from the same revision.
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "30901fac5ac033b4116542d847265346eabc0052" }

embassy-boot                 = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-boot-rp              = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-embedded-hal         = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-futures              = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-hal-internal         = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-nrf                  = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-rp                   = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-sync                 = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-time                 = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-time-driver          = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-time-queue-utils     = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-usb                  = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-usb-driver           = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-usb-logger           = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "deabd2f440033e98bfabfb7812950a4899fff4f1" }
[profile.release]
codegen-units = 1
debug = 2
lto = "thin"
opt-level = 3
