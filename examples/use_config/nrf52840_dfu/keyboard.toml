[keyboard]
name = "RMK nRF52840 Keyboard"
product_name = "My RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Haobo"
chip = "nrf52840"
usb_enable = true

[matrix]
row_pins = ["P0_02", "P0_03", "P0_04", "P0_05"]
col_pins = ["P0_06", "P0_07", "P0_08"]

[layout]
rows = 4
cols = 3
map = """
(0,0) (0,1) (0,2)
(1,0) (1,1) (1,2)
(2,0) (2,1) (2,2)
(3,0) (3,1) (3,2)
"""

[keymap]
layers = 1

[[keymap.layer]]
name = "base_layer"
keys = """
Kp7 Kp8 Kp9
Kp4 Kp5 Kp6
Kp1 Kp2 Kp3
_   Kp0 _
"""

[ble]
enabled = true

[dfu]
led = "P0_15" # default P0_15, to not use set to "none"
# Optional DFU lock — physical keys to press simultaneously to unlock DFU firmware download.
# Requires the `dfu_lock` Cargo feature (not enabled by default).
# unlock_keys = [[0, 0], [1, 1]]
