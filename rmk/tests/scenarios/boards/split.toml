# Shared 5x14 split fixture. Columns 0-6 are left-handed, 7-13 are
# right-handed, and the four inner thumb positions are bilateral.

[behavior.morse.profiles.p0]
[behavior.morse.profiles.p1]

[[behavior.morse.morses]]
morse_actions = [
  { pattern = "01", action = "A" },
  { pattern = "1000", action = "B" },
  { pattern = "1010", action = "C" },
  { pattern = "101", action = "K" },
  { pattern = "11", action = "M" },
  { pattern = "111", action = "O" },
  { pattern = "010", action = "R" },
  { pattern = "000", action = "S" },
]

[layout]
rows = 5
cols = 14
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)  (0,5,L)  (0,6,L)  (0,7,R)  (0,8,R)  (0,9,R)  (0,10,R)  (0,11,R)  (0,12,R)  (0,13,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)  (1,5,L)  (1,6,L)  (1,7,R)  (1,8,R)  (1,9,R)  (1,10,R)  (1,11,R)  (1,12,R)  (1,13,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)  (2,5,L)  (2,6,L)  (2,7,R)  (2,8,R)  (2,9,R)  (2,10,R)  (2,11,R)  (2,12,R)  (2,13,R)
(3,0,L)  (3,1,L)  (3,2,L)  (3,3,*)  (3,4,*)  (3,5,L)  (3,6,L)  (3,7,R)  (3,8,R)  (3,9,*)  (3,10,*)  (3,11,R)  (3,12,R)  (3,13,R)
(4,0,L)  (4,1,L)  (4,2,L)  (4,3,L)  (4,4,L)  (4,5,L)  (4,6,L)  (4,7,R)  (4,8,R)  (4,9,R)  (4,10,R)  (4,11,R)  (4,12,R)  (4,13,R)
"""

[[input_device.encoder]]
pin_a = "P0_00"
pin_b = "P0_01"

[[input_device.encoder]]
pin_a = "P0_02"
pin_b = "P0_03"

[[keymap.layer]]
keys = """
OSM(LShift)    OSL(1)         A            TH(B, C)  OSM(LCtrl)  WM(B, LGui)   MACRO(0)           MACRO(1)           MouseWheelUp  MouseAccel2  PDF(1)     A      LM(1, LShift)  User0
A              MT(B, LShift)  TD(0)        W         E           R             T                  MT(C, LGui)        LT(1, D)      MT(E, LAlt)  Y          U      I              O
TH(A, LShift)  TH(S, LGui)    TH(Z, LAlt)  V         B           N             D                  M                  Comma         Dot          L          X      C              F
MO(1)          No             A            A         Space       LT(1, D, p0)  MT(B, LShift, p0)  MT(B, LShift, p1)  TD(1)         Enter        Backspace  TD(2)  No             No
Kc1            Kc2            Kc3          Kc4       Kc5         Kc6           Escape             Enter              Kc7           Kc8          Kc9        Kc0    Backspace      No
"""
encoders = [["Right", "Left"], ["Down", "Up"]]

[[keymap.layer]]
keys = """
OSM(LShift | LCtrl)  No   C    D   E   F   No  No   No   No   No  B   No  No
Kp1                  Kp2  Kp5  No  No  No  No  Kp3  Kp4  Kp5  No  No  No  No
No                   No   No   No  No  No  No  No   No   No   No  No  No  No
_                    B    _    No  No  _   No  Kp1  No   No   No  No  No  No
No                   No   No   No  No  No  No  No   No   No   No  No  No  No
"""
encoders = [["PageDown", "PageUp"], ["End", "Home"]]
