# Topic pushes. A topic is server-to-host, so a scenario causes one with matrix
# input and then asserts the frame that arrives unprompted.
#
# Topics stay muted until `GetCapabilities` is served: a host that has not read
# the capabilities cannot size what it receives, so pushing to it is not safe.
features = ["rynk"]

[layout]
rows = 1
cols = 2
map = """
(0,0)  (0,1)
"""

[[keymap.layer]]
keys = "A  MO(1)"

[[keymap.layer]]
keys = "B  _"

[[test]]
name = "no_topic_is_pushed_before_the_handshake"
steps = [
  # A served request that is not `GetCapabilities` must not open the gate.
  { rynk = { cmd = "GetVersion", reply = { major = 0, minor = 2 } } },
  { press = [0, 1] },
  { rynk_no_reply = 50 },
  { release = [0, 1] },
]
