# Topic pushes. A topic is server-to-host, so a scenario causes one with matrix
# input and then asserts the frame that arrives unprompted.
#
# Topics stay muted until `GetCapabilities` is served: a host that has not read
# the capabilities cannot size what it receives, so pushing to it is not safe.
features = ["rynk"]

[layout]
rows = 1
cols = 2
map = """
(0,0)  (0,1)
"""

[[keymap.layer]]
keys = "A  MO(1)"

[[keymap.layer]]
keys = "B  _"

[[test]]
name = "no_topic_is_pushed_before_the_handshake"
steps = [
  # A served request that is not `GetCapabilities` must not open the gate.
  { rynk = { cmd = "GetVersion", reply = { major = 1, minor = 0 } } },
  { press = [0, 1] },
  { rynk_no_reply = 50 },
  { release = [0, 1] },
]

[[test]]
name = "layer_changes_are_pushed_after_the_handshake"
features = ["storage", "_ble", "split"]
steps = [
  { rynk = { cmd = "GetCapabilities", reply = {
    num_layers = 2, num_rows = 1, num_cols = 2, num_encoders = 0,
    max_combos = 8, max_combo_keys = 4, macro_space_size = 256,
    max_morse = 8, max_patterns_per_key = 8, max_forks = 8,
    storage_enabled = true, lighting_enabled = false,
    is_split = true, num_split_peripherals = 1,
    ble_enabled = true, num_ble_profiles = 3,
    max_payload_size = 482, max_bulk_keys = 47, max_bulk_items = 7,
    macro_chunk_size = 64, bulk_transfer_supported = true,
  } } },
  { press = [0, 1] },
  { rynk_topic = { topic = "LayerChange", payload = 1 } },
  { release = [0, 1] },
  { rynk_topic = { topic = "LayerChange", payload = 0 } },
]

# The other five topics forward state no matrix input reaches, so the scenario
# publishes the internal event behind each one and asserts the frame it pushes.
[[test]]
name = "state_changes_are_pushed_after_the_handshake"
features = ["storage", "_ble", "split"]
steps = [
  { rynk = { cmd = "GetCapabilities", reply = {
    num_layers = 2, num_rows = 1, num_cols = 2, num_encoders = 0,
    max_combos = 8, max_combo_keys = 4, macro_space_size = 256,
    max_morse = 8, max_patterns_per_key = 8, max_forks = 8,
    storage_enabled = true, lighting_enabled = false,
    is_split = true, num_split_peripherals = 1,
    ble_enabled = true, num_ble_profiles = 3,
    max_payload_size = 482, max_bulk_keys = 47, max_bulk_items = 7,
    macro_chunk_size = 64, bulk_transfer_supported = true,
  } } },
  { rynk_publish = { topic = "WpmUpdate", payload = 42 } },
  { rynk_topic = { topic = "WpmUpdate", payload = 42 } },
  { rynk_publish = { topic = "SleepState", payload = true } },
  { rynk_topic = { topic = "SleepState", payload = true } },
  { rynk_publish = { topic = "LedIndicatorChange", payload = { caps_lock = true } } },
  { rynk_topic = { topic = "LedIndicatorChange", payload = { num_lock = false, caps_lock = true, scroll_lock = false, compose = false, kana = false } } },
  { rynk_publish = { topic = "ConnectionChange", payload = { usb = "Suspended", ble = { profile = 1, state = "Advertising" }, preferred = "Ble" } } },
  { rynk_topic = { topic = "ConnectionChange", payload = { usb = "Suspended", ble = { profile = 1, state = "Advertising" }, preferred = "Ble" } } },
  { rynk_publish = { topic = "BatteryStatusChange", payload = { Available = { charge_state = "Discharging", level = 85 } } } },
  { rynk_topic = { topic = "BatteryStatusChange", payload = { Available = { charge_state = "Discharging", level = 85 } } } },
]
