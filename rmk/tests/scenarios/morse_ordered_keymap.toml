keyboard = "boards/split.toml"
features = ["buffered_tap_hold", "rynk"]

[behavior.morse]
buffered_tap_hold = true
normal_mode = true
hold_timeout = "200ms"

[[test]]
name = "keymap_edit_cannot_redirect_held_layer_release"
steps = [
  { press = [3, 0] },
  { rynk = { cmd = "SetKeyAction", payload = { position = { layer = 0, row = 3, col = 0 }, action = { Single = { LayerOn = 0 } } } } },
  { release = [3, 0] },
  { tap = { pos = [1, 0], duration = 20 } },
]
expect = [["A"], []]

[[test]]
name = "deferred_press_uses_layer_action_edited_before_execution"
steps = [
  { press = [3, 5] },
  { tap = { pos = [1, 0], duration = 20 } },
  { rynk = { cmd = "SetKeyAction", payload = { position = { layer = 1, row = 1, col = 0 }, action = { Single = { Key = { Hid = "B" } } } } } },
  { delay = 220 },
  { release = [3, 5] },
]
expect = [["B"], []]

[[test]]
name = "profile_edit_does_not_reclassify_an_existing_owner"
steps = [
  { press = [1, 1] },
  { rynk = { cmd = "SetBehaviorConfig", payload = { combo_timeout_ms = 50, oneshot_timeout_ms = 1000, tap_interval_ms = 200, tap_capslock_interval_ms = 250, morse_default_profile = { buffered_tap_hold = false, mode = "HoldOnOtherPress", hold_timeout_ms = 200 }, morse_prior_idle_time_ms = 120 } } },
  { tap = { pos = [1, 0], duration = 20 } },
  { release = [1, 1] },
]
expect = [["B"], ["A", "B"], ["B"], []]

[[test]]
name = "runtime_enable_waits_for_a_legacy_layer_release"
behavior.morse.buffered_tap_hold = false
steps = [
  { press = [3, 0] },
  { rynk = { cmd = "SetBehaviorConfig", payload = { combo_timeout_ms = 50, oneshot_timeout_ms = 1000, tap_interval_ms = 200, tap_capslock_interval_ms = 250, morse_default_profile = { buffered_tap_hold = true, mode = "Normal", hold_timeout_ms = 200 }, morse_prior_idle_time_ms = 120 } } },
  { release = [3, 0] },
  { tap = { pos = [1, 0], duration = 20 } },
  { press = [1, 1] },
  { tap = { pos = [1, 0], duration = 20 } },
  { release = [1, 1] },
]
expect = [["A"], [], ["B"], ["A", "B"], ["B"], []]

[[test]]
name = "runtime_enable_waits_for_a_legacy_mouse_release"
behavior.morse.buffered_tap_hold = false
steps = [
  { press = [0, 8] },
  { rynk = { cmd = "SetBehaviorConfig", payload = { combo_timeout_ms = 50, oneshot_timeout_ms = 1000, tap_interval_ms = 200, tap_capslock_interval_ms = 250, morse_default_profile = { buffered_tap_hold = true, mode = "Normal", hold_timeout_ms = 200 }, morse_prior_idle_time_ms = 120 } } },
  { release = [0, 8] },
  { delay = 250 },
  { tap = { pos = [1, 0], duration = 20 } },
]
expect = [{ mouse = { wheel = -1 } }, { mouse = {} }, ["A"], []]
