  { press = [0, 8] },
  { press = [0, 9] },
  { press = [0, 10] },
  { press = [0, 5] },
  { press = [0, 6] },
  { press = [0, 11] },
  { press = [0, 12] },
  { press = [0, 13] },
  { press = [0, 14] },
  { press = [0, 15] },
  { press = [0, 16] },
  { press = [0, 17] },
  { press = [0, 18] },
  { press = [0, 3] },
  { release = [0, 2] },
  { release = [0, 1] },
  { release = [0, 8] },
  { release = [0, 7] },
  { release = [0, 10] },
  { release = [0, 9] },
  { release = [0, 6] },
  { release = [0, 5] },
  { release = [0, 12] },
  { release = [0, 11] },
  { release = [0, 14] },
  { release = [0, 13] },
  { release = [0, 16] },
  { release = [0, 15] },
  { release = [0, 18] },
  { release = [0, 17] },
  { release = [0, 3] },
]
expect = [
  ["LAlt"],
