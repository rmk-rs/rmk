# Combos whose members are morse keys, resolved in HoldOnOtherPress mode.
#
# One of four `morse_combo_*` files — see `morse_combo_permissive_hold.toml`
# for the shared fixture and timeline names.

keyboard = "boards/split.toml"

[behavior.morse]
unilateral_tap = false
hold_on_other_press = true

[behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MT(B, LShift)", "MT(C, LGui)"], output = "X" },
  { actions = ["A", "MT(B, LShift)"], output = "Y" },
  { actions = ["MT(B, LShift)", "MT(C, LGui)", "LT(1, D)"], output = "Z" },
]

[[test]]
name = "two_key_in_window"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 20 },
  { tap = { pos = [1, 7], duration = 10 } },
  { delay = 300 },
  { release = [1, 1] },  # Release B
]
expect = [["X"], []]

[[test]]
name = "two_key_misses_window_both_held"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 60 },
  { press = [1, 7] },    # Press MT(C, LGui) — combo window expired
  { delay = 20 },
  { release = [1, 1] },  # Release B — held on the other press, so it is a mod
  { release = [1, 7] },  # Release C
]
expect = [["LShift"], ["LShift", "C"], ["C"], []]

[[test]]
name = "three_key_in_window"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 20 },
  { press = [1, 8] },    # Press LT(1, D)
  { delay = 20 },
  { press = [1, 7] },    # Press MT(C, LGui) — 3-key combo fires
  { delay = 20 },
  { release = [1, 1] },  # Release B
  { release = [1, 7] },  # Release C
  { release = [1, 8] },  # Release D
]
expect = [["Z"], []]

[[test]]
name = "three_key_misses_window"
steps = [
  { delay = 20 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 20 },
  { press = [1, 8] },    # Press LT(1, D)
  { delay = 60 },
  { press = [1, 7] },    # Press MT(C, LGui)
  { delay = 20 },
  { release = [1, 1] },  # Release B
  { release = [1, 8] },  # Release D
  { release = [1, 7] },  # Release C
]
expect = [["LShift"], ["LShift", "Kp3"], ["Kp3"], []]
