# Home row mods (HRM).
#
# For HRM, `enable_flow_tap` and `unilateral_tap` are enabled and
# `prior_idle_time` is considered.
#
# The morse fixture is the shared split board's home row, split across the
# halves so the hands differ: A@(1,0) and MT(B, LShift)@(1,1) on the left,
# MT(C, LGui)@(1,7), LT(1, D)@(1,8) and MT(E, LAlt)@(1,9) on the right, backed
# on layer 1 by Kp1..Kp5.
#
# HRM keys as combo members live in `morse_combo_hrm.toml`.

keyboard = "boards/split.toml"

[behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
unilateral_tap = true
permissive_hold = true

[[test]]
name = "mt_1"
steps = [
  { delay = 150 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { tap = { pos = [1, 0], duration = 10 } },
  { release = [1, 1] },
]
expect = [["B"], ["B", "A"], ["B"], []]

[[test]]
name = "mt_1_1"
steps = [
  { delay = 150 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { tap = { pos = [1, 8], duration = 10 } },
  { release = [1, 1] },
]
expect = [["LShift"], ["LShift", "D"], ["LShift"], []]

[[test]]
name = "mt_2"
steps = [
  { delay = 150 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { press = [1, 0] },  # Press A -> unilateral tap
  { release = [1, 1] },
  { release = [1, 0] },
]
expect = [["B"], ["B", "A"], ["A"], []]

[[test]]
name = "mt_2_1"
