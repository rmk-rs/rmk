[[test]]
name = "multi_tap"
steps = [
  { delay = 150 },
  { tap = { pos = [1, 0], duration = 120 } },
  { press = [1, 1] },  # Press MT(B, LShift)
  { delay = 60 },
  { press = [1, 7] },  # Press MT(C, LGui)
  { delay = 60 },
  { release = [1, 1] },
  { delay = 60 },
  { release = [1, 7] },
]
expect = [["A"], [], ["B"], ["B", "C"], ["C"], []]

[[test]]
name = "multi_tap_2"
steps = [
  { delay = 150 },
  { tap = { pos = [1, 0], duration = 10 } },
  { press = [1, 1] },  # Press MT(B, LShift) -> flow tap
  { delay = 200 },
  { press = [1, 7] },  # Press MT(C, LGui)
  { delay = 60 },
  { release = [1, 1] },
