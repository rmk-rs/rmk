[[test]]
name = "layer_tap"
steps = [
  { delay = 150 },
  { press = [1, 8] },  # Press LT(1, D)
  { tap = { pos = [1, 1], duration = 100 } },
  { release = [1, 8] },
  { tap = { pos = [1, 0], duration = 10 } },
  { press = [1, 8] },  # Press LT(1, D) -> flow tap after A
  { delay = 50 },
  { tap = { pos = [1, 1], duration = 100 } },
  { release = [1, 8] },
]
expect = [["Kp2"], [], ["A"], [], ["D"], ["D", "B"], ["D"], []]

[[test]]
name = "timeout_and_release_with_other_morse_key"
steps = [
  { delay = 150 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { delay = 200 },
  { tap = { pos = [1, 7], duration = 100 } },
  { delay = 100 },
  { release = [1, 1] },
]
expect = [["LShift"], ["LShift", "C"], ["LShift"], []]

[[test]]
name = "rolling_release_order"
steps = [
  { delay = 150 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },    # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },    # Press A
  { delay = 50 },
  { release = [1, 1] },  # Released B resolves as tap first
  { delay = 100 },
  { release = [1, 7] },
  { delay = 100 },
  { release = [1, 0] },
]
expect = [["B"], ["B", "C"], ["B", "C", "A"], ["C", "A"], ["A"], []]

[[test]]
name = "rolling_release_order_2"
steps = [
  { delay = 150 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },    # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },    # Press A
  { delay = 100 },
  { release = [1, 7] },  # Release C -> permissive hold of MT(B, LShift)
  { delay = 50 },
  { release = [1, 1] },
  { delay = 100 },
  { release = [1, 0] },
]
expect = [["LShift"], ["LShift", "C"], ["LShift", "C", "A"], ["LShift", "A"], ["A"], []]

[[test]]
name = "rolling_release_order_3"
steps = [
  { delay = 150 },
  { press = [1, 1] },    # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },    # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },    # Press A
  { delay = 100 },
  { release = [1, 7] },  # Release C -> permissive hold of MT(B, LShift)
  { delay = 100 },
  { release = [1, 0] },  # Release A
  { delay = 50 },
  { release = [1, 1] },  # Release B
]
expect = [["LShift"], ["LShift", "C"], ["LShift", "C", "A"], ["LShift", "A"], ["LShift"], []]

[[test]]
name = "multiple_permissive_hold"
steps = [
  { delay = 150 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },  # Press MT(C, LGui)
  { delay = 30 },
  { tap = { pos = [1, 0], duration = 100 } },
  { delay = 50 },
  { release = [1, 1] },
  { delay = 100 },
  { release = [1, 7] },
]
expect = [["B"], ["B", "C"], ["B", "C", "A"], ["B", "C"], ["C"], []]

[[test]]
name = "complex_rolling"
steps = [
  { delay = 160 },
  { press = [1, 0] },    # Press A
  { press = [1, 1] },    # Press MT(B, LShift) -> flow tap
  { release = [1, 0] },  # Release A
  { delay = 30 },
  { press = [1, 8] },    # Press LT(1, D) -> flow tap
  { delay = 30 },
  { press = [1, 7] },    # Press MT(C, LGui) -> flow tap
  { delay = 100 },
  { release = [1, 8] },  # Release D
  { delay = 50 },
  { release = [1, 1] },  # Release B
  { release = [1, 7] },  # Release C
]
expect = [["A"], ["A", "B"], ["B"], ["D", "B"], ["D", "B", "C"], ["B", "C"], ["C"], []]

[[test]]
name = "flow_tap"
steps = [
  { delay = 150 },
  { tap = { pos = [1, 0], duration = 30 } },
  { delay = 20 },
  { press = [1, 1] },  # Press MT(B, LShift) -> flow tap
  { press = [1, 7] },  # Press MT(C, LGui) -> flow tap
  { delay = 40 },
  { release = [1, 1] },
  { release = [1, 7] },
]
expect = [["A"], [], ["B"], ["B", "C"], ["C"], []]

# Ref: https://github.com/rmk-rs/rmk/pull/496
[[test]]
name = "previous_rolling_keypress"
steps = [
  { delay = 150 },
  { press = [1, 0] },    # Press A
  { delay = 150 },
  { press = [1, 8] },    # Press LT(1, D)
  { delay = 30 },
  { release = [1, 0] },  # Release A
  { delay = 150 },
  { tap = { pos = [1, 1], duration = 40 } },
  { release = [1, 8] },
]
expect = [["A"], [], ["Kp2"], []]

[[test]]
name = "multi_hold_cross_hand"
steps = [
  { delay = 150 },
  { press = [1, 7] },  # Press MT(C, LGui)
  { delay = 150 },
  { press = [1, 8] },  # Press LT(1, D)
  { tap = { pos = [1, 0], duration = 10 } },
  { delay = 40 },
  { release = [1, 7] },
  { release = [1, 8] },
]
expect = [["LGui"], ["LGui", "Kp1"], ["LGui"], []]

[[test]]
name = "flow_tap_misorder"
steps = [
  { delay = 150 },
  { press = [1, 7] },  # Press MT(C, LGui)
  { delay = 120 },
  { press = [1, 8] },  # Press LT(1, D)
  { release = [1, 7] },
  { press = [1, 9] },  # Press MT(E, LAlt) -> flow tap
  { release = [1, 8] },
  { release = [1, 9] },
]
expect = [["C"], [], ["D"], ["D", "E"], ["E"], []]

[[test]]
name = "mt_lt_combination"
steps = [
  { delay = 130 },
  { press = [1, 1] },  # Press MT(B, LShift)
  { delay = 130 },
  { press = [1, 8] },  # Press LT(1, D)
  { delay = 130 },
  { tap = { pos = [1, 0], duration = 130 } },
  { delay = 200 },
  { release = [1, 8] },
  { release = [1, 1] },
]
expect = [["LShift"], ["LShift", "Kp1"], ["LShift"], []]

[[test]]
name = "lt_opposite_hand_roll_permissive_hold"
steps = [
  { delay = 130 },
  { press = [1, 8] },  # Press LT(1, D)
  { delay = 20 },
  { press = [1, 0] },  # Press Kp1 on layer 1
  { delay = 20 },
  { press = [1, 1] },  # Press Kp2 on layer 1
  { delay = 20 },
  { release = [1, 0] },
  { delay = 20 },
  { release = [1, 1] },
  { release = [1, 8] },
]
expect = [["Kp1"], ["Kp1", "Kp2"], ["Kp2"], []]

[[test]]
name = "lt_opposite_hand_roll_permissive_hold_early_modifier_release"
steps = [
  { delay = 130 },
  { press = [1, 8] },    # Press LT(1, D)
  { delay = 20 },
  { press = [1, 0] },    # Press Kp1 on layer 1
  { delay = 20 },
  { press = [1, 1] },    # Press Kp2 on layer 1
  { delay = 20 },
  { release = [1, 0] },
  { release = [1, 8] },  # Release LT before the second key
  { delay = 20 },
  { release = [1, 1] },  # Release B
]
expect = [["Kp1"], ["Kp1", "Kp2"], ["Kp2"], []]
[[test]]
name = "normal_mode_same_hand_roll_order"
behavior.morse = { enable_flow_tap = false, permissive_hold = false, normal_mode = true }
steps = [
  { press = [1, 1] },  # Press MT(B, LShift) — HRM, Left hand
  { tap = { pos = [1, 0], duration = 10 } },
  { release = [1, 1] },
]
expect = [["B"], ["B", "A"], ["B"], []]
