# Macro endpoints. A macro travels whole, as its op list, addressed by slot.
features = ["rynk"]

[layout]
rows = 1
cols = 2
map = """
(0,0)  (0,1)
"""

[[keymap.layer]]
keys = "MACRO(0)  MACRO(1)"

# Slot 0 has a compiled-in default; slot 1 is empty.
[[behavior.macro.macros]]
operations = [
  { operation = "tap", keycode = "A" },
  { operation = "tap", keycode = "B" },
]

[[test]]
name = "default_macro_reads_back"
steps = [
  { rynk = { cmd = "GetMacro", payload = 0, reply = [{ Tap = { Key = { Hid = "A" } } }, { Tap = { Key = { Hid = "B" } } }] } },
  { rynk = { cmd = "GetMacro", payload = 1, reply = [] } },
]

# A write replaces the default: shortened, cleared and restored, the key runs
# what was last written.
[[test]]
name = "macro_write_changes_the_macro_key"
features = ["storage"]
steps = [
  { rynk = { cmd = "SetMacro", payload = { index = 0, macro_ops = [{ Tap = { Key = { Hid = "C" } } }] } } },
  { rynk = { cmd = "GetMacro", payload = 0, reply = [{ Tap = { Key = { Hid = "C" } } }] } },
  { tap = { pos = [0, 0], duration = 10 } },
  { rynk = { cmd = "SetMacro", payload = { index = 0, macro_ops = [] } } },
  { tap = { pos = [0, 0], duration = 10 } },
  { rynk = { cmd = "SetMacro", payload = { index = 0, macro_ops = [{ Tap = { Key = { Hid = "A" } } }, { Tap = { Key = { Hid = "B" } } }] } } },
  { tap = { pos = [0, 0], duration = 10 } },
]
expect = [["C"], [], ["A"], [], ["B"], []]

# Every op shape crosses the wire and comes back as written.
[[test]]
name = "every_op_shape_round_trips"
features = ["storage"]
steps = [
  { rynk = { cmd = "SetMacro", payload = { index = 1, macro_ops = [
    { Press = { KeyWithModifier = ["A", { left_ctrl = true }] } },
    { Release = { LayerOn = 1 } },
    { Delay = 300 },
    { Char = 97 },
    "PauseForRelease",
    { Tap = { Key = { Consumer = "VolumeIncrement" } } },
  ] } } },
  { rynk = { cmd = "GetMacro", payload = 1, reply = [
    { Press = { KeyWithModifier = ["A", { left_ctrl = true }] } },
    { Release = { LayerOn = 1 } },
    { Delay = 300 },
    { Char = 97 },
    "PauseForRelease",
    { Tap = { Key = { Consumer = "VolumeIncrement" } } },
  ] } },
]

# A slot outside `max_macros` is refused.
[[test]]
name = "slots_outside_max_macros_are_refused"
steps = [
  { rynk = { cmd = "GetMacro", payload = 32, error = "Invalid" } },
  { rynk = { cmd = "SetMacro", payload = { index = 32, macro_ops = [] }, error = "Invalid" } },
  # The default still stands.
  { tap = { pos = [0, 0], duration = 10 } },
]
expect = [["A"], [], ["B"], []]

