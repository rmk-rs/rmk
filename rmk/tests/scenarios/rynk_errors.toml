# Error envelopes and the frames a session must survive. These are the only
# scenarios that write bytes directly: a malformed or unknown frame has no
# endpoint to name it with.
features = ["rynk"]

[layout]
rows = 1
cols = 1
map = """
(0,0)
"""

[[keymap.layer]]
keys = "A"

# Frames below are `COBS(cmd_lo cmd_hi seq ++ postcard(payload)) ++ 0x00`.
[[test]]
name = "an_unknown_command_is_answered_with_unknown_cmd"
steps = [
  # cmd 0x7ffe, seq 1, empty payload. Below 0x8000, so it is a request the
  # session must answer rather than a topic push it must drop.
  { rynk_raw = [0x04, 0xfe, 0x7f, 0x01, 0x00] },
  { rynk_reply = [0x06, 0xfe, 0x7f, 0x01, 0x01, 0x06, 0x00] },
]

[[test]]
name = "a_truncated_payload_is_answered_with_malformed"
steps = [
  # SetKeyAction (0x0102), seq 2, one payload byte where a position needs three
  { rynk_raw = [0x04, 0x02, 0x01, 0x02, 0x01, 0x00] },
  { rynk_reply = [0x05, 0x02, 0x01, 0x02, 0x01, 0x01, 0x00] },
]

# A topic CMD is a server-to-host push; arriving as a request it is dropped
# without a reply, so a confused host cannot be answered into a loop.
[[test]]
name = "a_topic_cmd_sent_as_a_request_is_dropped"
steps = [
  { rynk_raw = [0x04, 0x01, 0x80, 0x03, 0x00] },
  { rynk_no_reply = 50 },
]

# Nothing to echo a cmd or seq from, so an oversized frame draws no reply at all.
