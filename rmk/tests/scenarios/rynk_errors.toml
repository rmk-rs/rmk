  { rynk_no_reply = 50 },
]

# Garbage is skipped at the next delimiter; the frame after it is served
# normally, which is what keeps a noisy link usable.
[[test]]
name = "the_session_resyncs_after_garbage"
steps = [
  { rynk_raw = [0xde, 0xad, 0xbe, 0xef, 0x00] },
  { rynk = { cmd = "GetVersion", reply = { major = 1, minor = 0 } } },
]

# A position outside the keymap is well-formed but meaningless, so it is
# refused rather than clamped onto a neighbouring key.
[[test]]
name = "an_out_of_range_position_is_refused"
steps = [
  { rynk = { cmd = "GetKeyAction", payload = { layer = 9, row = 0, col = 0 }, error = "Invalid" } },
  { rynk = { cmd = "SetKeymapBulk", payload = { layer = 0, start_row = 0, start_col = 0, actions = [
    { Single = { Key = { Hid = "A" } } },
    { Single = { Key = { Hid = "B" } } },
  ] }, error = "Invalid" } },
]
