# A steno key is a bit index into the 64-bit chord bitmap, so the report says
# which keys are down rather than which keycodes were typed. `STN(..)` only
# exists with the `steno` feature, so the whole file is gated on it.

features = ["steno"]

[layout]
rows = 1
cols = 4
map = "(0,0) (0,1) (0,2) (0,3)"

[[keymap.layer]]
keys = "STN(S1) STN(T) STN(P) STN(S1)"

[[test]]
name = "steno_key_sets_its_chord_bit"
steps = [
  { press = [0, 0] },
  { release = [0, 0] },
]
expect = [{ steno = ["S1"] }, { steno = [] }]

# Plover builds the chord from the live state, so every press and release must
# re-send the whole bitmap: held keys stay set and a release clears only its
# own bit.
[[test]]
name = "chord_reports_live_state_on_every_change"
steps = [
  { press = [0, 0] },
  { press = [0, 1] },
  { press = [0, 2] },
  { release = [0, 0] },
  { release = [0, 1] },
  { release = [0, 2] },
]
expect = [
  { steno = ["S1"] },
  { steno = ["S1", "T"] },
  { steno = ["S1", "T", "P"] },
  { steno = ["T", "P"] },
  { steno = ["P"] },
  { steno = [] },
]

# The documented layout repeats S1: releasing one position must not clear
# the other held position or end the stroke before its next key arrives.
[[test]]
name = "shared_steno_key_stays_down_until_last_release"
steps = [
  { press = [0, 0] },
  { press = [0, 3] },
  { release = [0, 0] },
  { press = [0, 1] },
  { release = [0, 1] },
  { release = [0, 3] },
]
expect = [
  { steno = ["S1"] },
  { steno = ["S1"] },
  { steno = ["S1"] },
  { steno = ["S1", "T"] },
  { steno = ["S1"] },
  { steno = [] },
]
