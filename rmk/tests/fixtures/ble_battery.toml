[ble]
enabled = true
max_connections = 2

[rmk]
num_ble_profiles = 2

[split]
connection = "ble"

[split.central]
rows = 1
cols = 1
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pins = [["P0_02"]]

[split.central.battery]
battery_adc_pin = "vddh"

[[split.peripheral]]
rows = 1
cols = 1
row_offset = 0
col_offset = 1

[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pins = [["P0_02"]]

[split.peripheral.battery]
battery_adc_pin = "vddh"
