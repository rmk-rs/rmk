name: nRF52832 Flash Attribution
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nrf52832-flash-attribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLANG_PATH: /usr/bin/clang-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: pool-control
            revision: 3d2efcd0094bcab1b2005fc30f0425e337691f7b
          - variant: pool-bss
            revision: 3d2efcd0094bcab1b2005fc30f0425e337691f7b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}
          path: firmware
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/examples/use_config/nrf52832_ble -> target
          shared-key: nrf52832-flash-attribution
      - name: Install build tools
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo install flip-link --locked
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev
      - uses: actions/checkout@v6
        with:
          repository: embassy-rs/trouble
          ref: 8cca99e5c217e7b4d5da0f12c9725b93623dc4d3
          path: trouble
      - name: Use the same local dependency source in both builds
        run: |
          cat >> firmware/examples/use_config/nrf52832_ble/Cargo.toml <<'TOML'

          [patch."https://github.com/embassy-rs/trouble"]
          trouble-host = { path = "../../../../trouble/host" }
          TOML
      - name: Make packet pool initialization all zero
        if: matrix.variant == 'pool-bss'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('trouble/host/src/packet_pool.rs')
          s = p.read_text()
          changes = {
              'free: bool': 'allocated: bool',
              'free: true': 'allocated: false',
              'if packet.free {': 'if !packet.allocated {',
              'packet.free = false;': 'packet.allocated = true;',
              'self.packets[p_ref.idx].free = true;': 'self.packets[p_ref.idx].allocated = false;',
              'filter(|p| p.free)': 'filter(|p| !p.allocated)',
          }
          for before, after in changes.items():
              assert s.count(before) == 1, before
              s = s.replace(before, after)
          old = '        assert!(b2.is_none());'
          new = old + '\n        assert_eq!(pool.available(), 0);\n\n        pool.free(&a1.unwrap());\n        assert_eq!(pool.available(), 1);\n        assert!(pool.alloc().is_some());\n        assert!(pool.alloc().is_none());'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PYCODE
      - name: Test packet allocation, exhaustion and reuse
        if: matrix.variant == 'pool-bss'
        run: cargo test --manifest-path trouble/host/Cargo.toml --lib --no-default-features --features log,peripheral,central,gatt,derive,security,default-packet-pool packet_pool::tests
      - name: Build one nRF52832 firmware with a link map
        working-directory: firmware/examples/use_config/nrf52832_ble
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE/firmware=/rmk-build"
          cargo rustc --release --bin rmk-nrf52832 -- -C "link-arg=-Map=$GITHUB_WORKSPACE/output/firmware.map"
          elf=target/thumbv7em-none-eabihf/release/rmk-nrf52832
          cp "$elf" "$GITHUB_WORKSPACE/output/firmware.elf"
          arm-none-eabi-size "$elf" > "$GITHUB_WORKSPACE/output/size.txt"
          arm-none-eabi-nm -S --defined-only --size-sort "$elf" > "$GITHUB_WORKSPACE/output/symbols.txt"
          arm-none-eabi-readelf -SW "$elf" > "$GITHUB_WORKSPACE/output/sections.txt"
          cargo tree --locked > "$GITHUB_WORKSPACE/output/dependencies.txt"
          cp Cargo.lock "$GITHUB_WORKSPACE/output/Cargo.lock"
          git -C "$GITHUB_WORKSPACE/firmware" rev-parse HEAD > "$GITHUB_WORKSPACE/output/revision.txt"
          git -C "$GITHUB_WORKSPACE/firmware" diff > "$GITHUB_WORKSPACE/output/variant.patch"
          rustc -Vv > "$GITHUB_WORKSPACE/output/toolchain.txt"
          git -C "$GITHUB_WORKSPACE/trouble" diff > "$GITHUB_WORKSPACE/output/dependency.patch"
          cp "$GITHUB_WORKSPACE/trouble/host/src/packet_pool.rs" "$GITHUB_WORKSPACE/output/packet_pool.rs"
          cat "$GITHUB_WORKSPACE/output/size.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: nrf52832-${{ matrix.variant }}
          path: output/
          retention-days: 7
