name: Publish

on:
  # `push`, not `pull_request`: the environment only allows protected branches,
  # and a pull_request run's ref is `refs/pull/N/merge`, which is not one.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before the approval gate and without a token, so what you approve is a
  # checked plan.
  plan:
    # Merging a release PR is open to any maintainer; a manual dispatch is not.
    if: github.event_name != 'workflow_dispatch' || github.actor == 'HaoboGu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      - id: gate
        name: Publish only a merged release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source .github/ci/_lib.sh
          # Ask which PR this commit came from: squash, merge and rebase each
          # write a different message, so matching on the message is fragile.
          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
          if [ "$branch" = "$RELEASE_BRANCH" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "not a release PR merge (head branch: ${branch:-none})"
          fi

      - name: Summarise what will be published
        if: steps.gate.outputs.release == 'true'
        run: |
          source .github/ci/_lib.sh
          {
            printf '| crate | version | action |\n|---|---|---|\n'
            for name in "${RELEASE_CRATES[@]}"; do
              version="$(crate_version "$name")"
              if crate_published "$name" "$version"; then
                printf '| %s | %s | already on crates.io |\n' "$name" "$version"
              else
                printf '| %s | %s | **publish** |\n' "$name" "$version"
              fi
            done
            printf '\nApprove the `crates-io` deployment to publish.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    # Required reviewers hold the job here, and crates.io only issues a token to
    # a run that got past them.
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the tag step can see which tags already exist.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish

      # The rynk-ble verify build links BlueZ through libdbus on the host.
      - name: Install host system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish, tag, release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: .github/ci/publish.sh
